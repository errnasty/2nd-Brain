name: Score trending stories

# GitHub-Actions-backed cron — works on any host (Railway, your own VPS).
# Uses the same two secrets as the feed sync workflow:
#   APP_URL      = https://your-site.up.railway.app
#   CRON_SECRET  = the same value you set in your hosting platform's env vars
#
# Runs hourly, more often than the 2-hourly feed sync, because trending is a
# decaying quantity: scores have to be recomputed as stories age even when no
# new articles have arrived. Each run is wall-clock budgeted and resumes from
# where the last one stopped, so extra runs are cheap and never duplicate work.

on:
  schedule:
    - cron: "20 * * * *"     # hourly, offset from the feed sync's :00
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  trending:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trending pass
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET secret"; exit 1
          fi
          response=$(curl -sSL -o /tmp/trending.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 290 \
            "$APP_URL/api/cron/trending")
          echo "HTTP $response"
          cat /tmp/trending.json
          if [ "$response" != "200" ]; then exit 1; fi
