name: Sync RSS feeds

# GitHub-Actions-backed cron — works on any host (Railway, your own VPS).
# Set the two secrets in: GitHub repo → Settings → Secrets and variables → Actions
#   APP_URL      = https://your-site.up.railway.app
#   CRON_SECRET  = the same value you set in your hosting platform's env vars

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours UTC
  workflow_dispatch:         # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger feed sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET secret"; exit 1
          fi
          # Trim stray whitespace and trailing slashes. Either one turns the
          # URL below into something that redirects, and a redirect is fatal
          # here for the reason in the next comment.
          APP_URL="$(printf '%s' "$APP_URL" | tr -d '[:space:]' | sed 's:/*$::')"
          # Force https. A host copied out of a dashboard usually arrives with
          # no scheme at all, and curl then defaults it to http:// — which the
          # host answers with a 301 to https, and that scheme change is itself
          # an origin change, so the Authorization header is dropped exactly as
          # it would be for a different domain. Upgrade rather than fail: this
          # is the single most common way the secret gets set, and there is no
          # case where we would rather send a cron token over plaintext http.
          case "$APP_URL" in
            https://*) ;;
            http://*)  APP_URL="https://${APP_URL#http://}" ;;
            *)         APP_URL="https://$APP_URL" ;;
          esac
          # Deliberately no -L. curl drops the Authorization header across any
          # origin change — a different host, or the same host over http vs
          # https — so following a redirect silently converts an authorised
          # call into an anonymous one, and the server answers 401 as though
          # the secret were wrong. Fail loudly and name the target instead.
          response=$(curl -sS -o /tmp/sync.json -w "%{http_code} %{redirect_url}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 290 \
            "$APP_URL/api/cron/sync-feeds")
          code="${response%% *}"
          redirect="${response#* }"
          echo "HTTP $code"
          case "$code" in
            3*)
              echo "APP_URL redirects to: ${redirect:-<unknown>}"
              echo "Set the APP_URL secret to that final URL (scheme included)."
              echo "curl strips the Authorization header across a redirect, so the"
              echo "server receives no token and reports it as a secret mismatch."
              exit 1
              ;;
          esac
          cat /tmp/sync.json
          if [ "$code" != "200" ]; then exit 1; fi
